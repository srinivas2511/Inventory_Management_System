name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build · unit · IT · ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and verify
        working-directory: backend
        run: mvn verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/

  frontend:
    name: Frontend (lint · format · test · audit · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Unit tests
        working-directory: frontend
        run: npm run test:ci

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Production build
        working-directory: frontend
        run: npm run build:prod

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.dev.yml \
            up --build -d

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ims-backend-1 2>/dev/null || echo "unknown")
            echo "  attempt $i: $status"
            [ "$status" = "healthy" ] && break
            sleep 10
          done
          [ "$status" = "healthy" ] || { docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml logs; exit 1; }

      - name: Ping API
        run: curl -sf http://localhost:8080/api/system/ping | jq .

      - name: Frontend reachable
        run: curl -sf -o /dev/null -w "%{http_code}" http://localhost:8081/ | grep -q 200

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml down -v

  owasp:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    # Run on push to main only — the NVD download is slow and rate-limited.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: OWASP check
        working-directory: backend
        # failBuildOnCVSS=7 fails on high/critical; suppressionFile can be added later.
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DskipTests
        continue-on-error: true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html
