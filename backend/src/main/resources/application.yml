spring:
  application:
    name: ims
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ims}
    username: ${DB_USER:ims}
    password: ${DB_PASSWORD:ims}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        default_schema: ims
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: ims
    default-schema: ims
    create-schemas: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true   # reject unexpected JSON fields (over-posting protection)
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  servlet:
    multipart:
      # Hard ceiling for the container; the enforced upload limit is the setting documents.max_size_mb.
      max-file-size: 50MB
      max-request-size: 52MB

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200     # reporting degradation is non-critical; app is still available (NFR-003)
      group:
        readiness:
          include: readinessState,db
        reporting:
          include: reporting        # DEGRADED here never affects readiness (NFR-003)
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

ims:
  security:
    cors-origins: ${CORS_ORIGINS:http://localhost:4200}
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars!!}
      access-token-minutes: 15
      refresh-token-days: 7
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  documents:
    storage-root: ${DOCUMENTS_STORAGE_ROOT:./data/documents}
  attachments:
    storage-path: ${ATTACHMENTS_STORAGE_PATH:./data/attachments}
  notification:
    from: ${NOTIFICATION_FROM:noreply@ims.local}
    outbox-delay-ms: 30000
  integration:
    # 32 random bytes, base64. Webhook secrets are stored AES-GCM encrypted under this key; without it none can be created.
    secret-key: ${IMS_INTEGRATION_SECRET_KEY:}
    webhook:
      allow-private-targets: false     # true only for local development against http://localhost targets
      poll-delay-ms: 30000
  ai:
    forecast:
      url: ${IMS_AI_FORECAST_URL:}     # empty = no AI forecasting; manual forecasts only
      api-key: ${IMS_AI_FORECAST_API_KEY:}
  demo:
    load-data: false           # true only under the dev/demo profile (Phase 8 loader)
