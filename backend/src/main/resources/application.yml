spring:
  application:
    name: ims
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ims}
    username: ${DB_USER:ims}
    password: ${DB_PASSWORD:ims}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        default_schema: ims
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: ims
    default-schema: ims
    create-schemas: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true   # reject unexpected JSON fields (over-posting protection)
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

ims:
  security:
    cors-origins: ${CORS_ORIGINS:http://localhost:4200}
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars!!}
      access-token-minutes: 15
      refresh-token-days: 7
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  demo:
    load-data: false           # true only under the dev/demo profile (Phase 8 loader)
