ims:
  documents:
    storage-root: ${java.io.tmpdir}/ims-test-documents
  notification:
    # The outbox job never fires during a test run; tests drive NotificationOutboxJob.processDue() themselves.
    outbox-delay-ms: 3600000
  integration:
    # test-only key (32 bytes of 0x42, base64); never a real secret
    secret-key: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
    webhook:
      allow-private-targets: true    # the tests deliver to a server on localhost
      poll-delay-ms: 3600000         # the delivery job never fires on its own; tests call processDue()

management:
  endpoints:
    web:
      exposure:
        # production-like exposure so ActuatorExposureIT proves the security rule (D-35); the dev profile exposes only health,info
        include: health,info,metrics,prometheus
