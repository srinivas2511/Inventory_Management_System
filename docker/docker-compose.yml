# Base stack. Use with an override:
#   dev:  docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up --build
#   prod: docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file docker/.env up -d --build
name: ims

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ims}
      POSTGRES_USER: ${DB_USER:-ims}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ims}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ims}
      DB_USER: ${DB_USER:-ims}
      DB_PASSWORD: ${DB_PASSWORD:-ims}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
